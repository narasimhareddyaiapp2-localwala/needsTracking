name: Supabase Complete Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SOURCE_PROJECT_REF: ${{ vars.SOURCE_PROJECT_REF }}
      TARGET_PROJECT_REF: ${{ vars.TARGET_PROJECT_REF }}
      # Migration reported by Supabase as present remotely but missing locally.
      # This repair changes migration HISTORY only; it does not run or delete SQL.
      SOURCE_REPAIR_MIGRATION: "20260906033346"

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ============================================================
      # 2. SUPABASE CLI
      # ============================================================

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"

      # ============================================================
      # 3. POSTGRES CLIENT
      # ============================================================

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ============================================================
      # 4. SHOW CONFIGURATION
      # ============================================================

      - name: Show Migration Configuration
        run: |
          echo "=========================================="
          echo "SUPABASE MIGRATION"
          echo "=========================================="
          echo "SOURCE : $SOURCE_PROJECT_REF"
          echo "TARGET : $TARGET_PROJECT_REF"
          echo "SOURCE HISTORY REPAIR : $SOURCE_REPAIR_MIGRATION"
          echo "=========================================="

      # ============================================================
      # 5. LOGIN SOURCE
      # ============================================================

      - name: Login to SOURCE
        env:
          SOURCE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SOURCE_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "Logging into SOURCE..."

          supabase login \
            --token "$SOURCE_SUPABASE_ACCESS_TOKEN"

      # ============================================================
      # 6. LINK SOURCE
      # ============================================================

      - name: Link SOURCE Project
        env:
          SOURCE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD }}
        run: |
          set -e

          rm -rf .supabase

          supabase link \
            --project-ref "$SOURCE_PROJECT_REF" \
            --password "$SOURCE_DB_PASSWORD"

          echo "SOURCE linked successfully."

      # ============================================================
      # 7. SOURCE MIGRATION HISTORY BEFORE REPAIR
      # ============================================================

      - name: Check SOURCE Migration History Before Repair
        run: |
          set -e

          echo "=========================================="
          echo "SOURCE MIGRATION HISTORY - BEFORE REPAIR"
          echo "=========================================="

          supabase migration list

      # ============================================================
      # 8. REPAIR SOURCE HISTORY
      #
      # The SOURCE database reports migration 20260906033346 as
      # applied, but the local repository does not contain that
      # migration. Marking it reverted changes ONLY the migration
      # history table. It does NOT undo database schema changes.
      #
      # db pull will then capture the current SOURCE schema into a
      # new local migration file.
      # ============================================================

      - name: Repair SOURCE Migration History
        run: |
          set -e

          echo "=========================================="
          echo "REPAIRING SOURCE MIGRATION HISTORY"
          echo "=========================================="

          if supabase migration list | grep -q "$SOURCE_REPAIR_MIGRATION"; then
            echo "Repairing migration: $SOURCE_REPAIR_MIGRATION"

            supabase migration repair \
              "$SOURCE_REPAIR_MIGRATION" \
              --status reverted

            echo "SOURCE migration history repaired."
          else
            echo "Migration $SOURCE_REPAIR_MIGRATION was not found."
            echo "No repair required."
          fi

      # ============================================================
      # 9. VERIFY SOURCE HISTORY AFTER REPAIR
      # ============================================================

      - name: Check SOURCE Migration History After Repair
        run: |
          set -e

          echo "=========================================="
          echo "SOURCE MIGRATION HISTORY - AFTER REPAIR"
          echo "=========================================="

          supabase migration list

      # ============================================================
      # 10. PULL SOURCE SCHEMA
      # ============================================================

      - name: Pull SOURCE Schema
        run: |
          set -e

          echo "=========================================="
          echo "PULLING SOURCE SCHEMA"
          echo "=========================================="

          mkdir -p supabase/migrations

          supabase db pull

          echo ""
          echo "Generated migration files:"

          find supabase/migrations \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ============================================================
      # 11. DISPLAY SCHEMA OBJECTS
      # ============================================================

      - name: Inspect SOURCE Schema
        run: |
          set -e

          echo "=========================================="
          echo "TABLES"
          echo "=========================================="

          grep -iE 'CREATE TABLE' \
            supabase/migrations/*.sql || true

          echo ""
          echo "=========================================="
          echo "FUNCTIONS"
          echo "=========================================="

          grep -iE 'CREATE (OR REPLACE )?FUNCTION' \
            supabase/migrations/*.sql || true

          echo ""
          echo "=========================================="
          echo "TRIGGERS"
          echo "=========================================="

          grep -iE 'CREATE TRIGGER' \
            supabase/migrations/*.sql || true

          echo ""
          echo "=========================================="
          echo "POLICIES"
          echo "=========================================="

          grep -iE 'CREATE POLICY' \
            supabase/migrations/*.sql || true

          echo ""
          echo "=========================================="
          echo "VIEWS"
          echo "=========================================="

          grep -iE 'CREATE (OR REPLACE )?VIEW' \
            supabase/migrations/*.sql || true

      # ============================================================
      # 12. LOGIN TARGET
      # ============================================================

      - name: Login to TARGET
        env:
          TARGET_SUPABASE_ACCESS_TOKEN: ${{ secrets.TARGET_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e

          supabase login \
            --token "$TARGET_SUPABASE_ACCESS_TOKEN"

          echo "TARGET login successful."

      # ============================================================
      # 13. LINK TARGET
      # ============================================================

      - name: Link TARGET Project
        env:
          TARGET_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD }}
        run: |
          set -e

          rm -rf .supabase

          supabase link \
            --project-ref "$TARGET_PROJECT_REF" \
            --password "$TARGET_DB_PASSWORD"

          echo "TARGET linked successfully."

      # ============================================================
      # 14. TARGET MIGRATION HISTORY
      # ============================================================

      - name: Check TARGET Migration History
        run: |
          set -e

          echo "=========================================="
          echo "TARGET MIGRATION HISTORY"
          echo "=========================================="

          supabase migration list

      # ============================================================
      # 15. PUSH DATABASE SCHEMA TO TARGET
      # ============================================================

      - name: Push Database Schema to TARGET
        run: |
          set -e

          echo "=========================================="
          echo "PUSHING DATABASE SCHEMA"
          echo "=========================================="

          supabase db push

          echo "Database schema migration completed."

      # ============================================================
      # 16. VERIFY DATABASE MIGRATION
      # ============================================================

      - name: Verify Database Migration
        run: |
          set -e

          echo "=========================================="
          echo "TARGET MIGRATION HISTORY"
          echo "=========================================="

          supabase migration list

      # ============================================================
      # 17. CHECK EDGE FUNCTIONS IN REPOSITORY
      # ============================================================

      - name: Check Edge Functions
        run: |
          echo "=========================================="
          echo "EDGE FUNCTIONS"
          echo "=========================================="

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory found."
            exit 0
          fi

          find supabase/functions \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" \
            | sort

      # ============================================================
      # 18. DEPLOY EDGE FUNCTIONS
      # ============================================================

      - name: Deploy Edge Functions
        run: |
          set -e

          if [ ! -d "supabase/functions" ]; then
            echo "No Edge Functions directory."
            exit 0
          fi

          echo "=========================================="
          echo "DEPLOYING EDGE FUNCTIONS"
          echo "=========================================="

          found=false

          for dir in supabase/functions/*/; do

            if [ ! -d "$dir" ]; then
              continue
            fi

            function_name=$(basename "$dir")

            if [ "$function_name" = "_shared" ]; then
              echo "Skipping _shared"
              continue
            fi

            found=true

            echo ""
            echo "Deploying:"
            echo "$function_name"

            supabase functions deploy "$function_name" \
              --project-ref "$TARGET_PROJECT_REF"

            echo "SUCCESS: $function_name"

          done

          if [ "$found" = false ]; then
            echo "No Edge Functions found."
          fi

      # ============================================================
      # 19. STORAGE CONFIGURATION
      # ============================================================

      - name: Check Storage Configuration
        run: |
          echo "=========================================="
          echo "STORAGE"
          echo "=========================================="

          echo "Storage bucket/object files are handled separately."
          echo "Database metadata for storage is included in the schema."

      # ============================================================
      # 20. FINAL MIGRATION SUMMARY
      # ============================================================

      - name: Migration Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "SUPABASE MIGRATION SUMMARY"
          echo "=========================================="
          echo ""
          echo "SOURCE:"
          echo "$SOURCE_PROJECT_REF"
          echo ""
          echo "TARGET:"
          echo "$TARGET_PROJECT_REF"
          echo ""
          echo "Completed stages:"
          echo "  Database schema"
          echo "  PostgreSQL functions"
          echo "  Triggers"
          echo "  RLS policies"
          echo "  Views"
          echo "  Indexes"
          echo "  Edge Functions"
          echo ""
          echo "Storage OBJECT files are NOT copied by this workflow."
          echo ""
          echo "=========================================="

      # ============================================================
      # 21. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        run: |
          rm -rf .supabase

          echo "Cleanup completed."
